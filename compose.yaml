services:
  api:
    build:
      context: .
      dockerfile: api.Dockerfile
    container_name: roomies-api
    environment:
      NODE_ENV: production
      PORT: "3000"
    ports:
      - "3000:3000"

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: roomies-frontend
    depends_on:
      - api
    ports:
      - "8080:80"
